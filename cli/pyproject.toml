[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgcheck-cli"
version = "0.1.0"
description = "Check a Python package name for risk before you pip install it"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pkgcheck = "pkgcheck_cli.main:main"